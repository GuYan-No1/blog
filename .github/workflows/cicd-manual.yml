name: Build & Deploy Blog

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'docs/**'

  workflow_dispatch:
    inputs:
      service:
        description: 选择要发布的服务
        required: true
        type: choice
        options:
          - web
          - api
          - both
        default: both
      image_tag:
        description: 镜像标签（留空自动生成）
        required: false
        type: string
      do_deploy:
        description: 是否立即部署到集群
        required: true
        type: boolean
        default: true

concurrency:
  group: deploy-blog
  cancel-in-progress: false

env:
  TCR_REGISTRY: ccr.ccs.tencentyun.com
  TCR_NAMESPACE: blog-865748877

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      deploy_enabled: ${{ steps.meta.outputs.deploy_enabled }}
      service: ${{ steps.meta.outputs.service }}
      changed_web: ${{ steps.paths.outputs.web }}
      changed_api: ${{ steps.paths.outputs.api }}
    steps:
      # ========== 修复1：必须先拉取代码，路径检测依赖git信息 ==========
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 保留2层提交历史，足够对比文件改动

      - name: Validate required variables
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL}" ]; then
            echo "::error::缺少 NEXT_PUBLIC_API_URL 变量"
            exit 1
          fi
          echo "前端构建期 API 地址: ${API_URL}"

      - name: Compute image tag & deploy flag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SERVICE: ${{ inputs.service }}
          INPUT_DO_DEPLOY: ${{ inputs.do_deploy }}
        run: |
          set -euo pipefail
          if [[ "${REF}" == refs/tags/v* ]]; then
            TAG="${REF#refs/tags/}"
            DEPLOY_ENABLED="true"
            SERVICE="both"
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_TAG}" ]; then
              TAG="${INPUT_TAG}"
            else
              TAG="sha-$(echo "${SHA}" | cut -c1-7)"
            fi
            DEPLOY_ENABLED="${INPUT_DO_DEPLOY}"
            SERVICE="${INPUT_SERVICE}"
          else
            TAG="sha-$(echo "${SHA}" | cut -c1-7)"
            DEPLOY_ENABLED="false"
            SERVICE="both"
          fi

          echo "镜像标签: ${TAG}"
          echo "是否部署: ${DEPLOY_ENABLED}"
          echo "发布服务: ${SERVICE}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "deploy_enabled=${DEPLOY_ENABLED}" >> "$GITHUB_OUTPUT"
          echo "service=${SERVICE}" >> "$GITHUB_OUTPUT"

      - name: 检测代码改动路径
        id: paths
        uses: dorny/paths-filter@v3
        with:
          # ========== 修复2：标签发布默认全量构建，普通提交对比上一版 ==========
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'Dockerfile'
              - '.github/workflows/**'
            api:
              - 'services/api/**'
              - '.github/workflows/**'

  build-web:
    needs: prepare
    if: |
      (needs.prepare.outputs.service == 'web' || needs.prepare.outputs.service == 'both')
      && (startsWith(github.ref, 'refs/tags/v') || needs.prepare.outputs.changed_web == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 缓存 pnpm 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            **/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to TCR
        env:
          REGISTRY: ${{ env.TCR_REGISTRY }}
          TCR_USER: ${{ secrets.TCR_USERNAME }}
          TCR_PWD: ${{ secrets.TCR_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${TCR_PWD}" | docker login "${REGISTRY}" -u "${TCR_USER}" --password-stdin

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/blog-web:${{ needs.prepare.outputs.tag }}
            ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/blog-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-api:
    needs: prepare
    if: |
      (needs.prepare.outputs.service == 'api' || needs.prepare.outputs.service == 'both')
      && (startsWith(github.ref, 'refs/tags/v') || needs.prepare.outputs.changed_api == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
           fetch-depth: 1

      - name: 缓存 uv 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('services/api/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to TCR
        env:
          REGISTRY: ${{ env.TCR_REGISTRY }}
          TCR_USER: ${{ secrets.TCR_USERNAME }}
          TCR_PWD: ${{ secrets.TCR_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${TCR_PWD}" | docker login "${REGISTRY}" -u "${TCR_USER}" --password-stdin

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/blog-api:${{ needs.prepare.outputs.tag }}
            ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/blog-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [prepare, build-web, build-api]
    # ========== 修复3：兼容build任务被跳过的场景，skipped不算失败 ==========
    if: |
      needs.prepare.outputs.deploy_enabled == 'true'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy web
        if: needs.prepare.outputs.service == 'web' || needs.prepare.outputs.service == 'both'
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/blog-web:${{ needs.prepare.outputs.tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 10m
          envs: IMAGE
          script: |
            set -e
            K="kubectl"
            echo "=== 更新 blog-web 镜像 -> ${IMAGE} ==="
            $K -n default set image deploy/blog-web blog-web="${IMAGE}"
            if ! $K -n default rollout status deploy/blog-web --timeout=240s; then
              echo "=== 滚动更新失败，自动回滚 ==="
              $K -n default rollout undo deploy/blog-web
              $K -n default rollout status deploy/blog-web --timeout=240s
              exit 1
            fi
            $K -n default get pods -l app=blog-web -o wide

      - name: Deploy api
        if: needs.prepare.outputs.service == 'api' || needs.prepare.outputs.service == 'both'
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/blog-api:${{ needs.prepare.outputs.tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 10m
          envs: IMAGE
          script: |
            set -e
            K="kubectl"
            echo "=== 更新 blog-api 镜像 -> ${IMAGE} ==="
            $K -n default set image deploy/blog-api blog-api="${IMAGE}"
            if ! $K -n default rollout status deploy/blog-api --timeout=240s; then
              echo "=== 滚动更新失败，自动回滚 ==="
              $K -n default rollout undo deploy/blog-api
              $K -n default rollout status deploy/blog-api --timeout=240s
              exit 1
            fi
            $K -n default get pods -l app=blog-api -o wide

      - name: Smoke test (公网验证)
        run: |
          set -e
          echo "--- 博客首页 ---"
          curl -sS -o /dev/null -w "status=%{http_code}\n" https://xmoekr.cn/
          echo "--- 后端接口 ---"
          curl -sS -o /dev/null -w "status=%{http_code}\n" https://api.xmoekr.cn/api/v1/articles
