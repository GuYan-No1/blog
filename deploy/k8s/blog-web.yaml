apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-web
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-web
  template:
    metadata:
      labels:
        app: blog-web
    spec:
      imagePullSecrets:
        - name: tcr-secret
      containers:
        - name: blog-web
          image: ccr.ccs.tencentyun.com/blog-865748877/blog-web:v1
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: blog-web-svc
  namespace: default
spec:
  selector:
    app: blog-web
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-web-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-api-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - xmoekr.cn
      secretName: blog-tls-secret
  rules:
    - host: xmoekr.cn
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: blog-api-svc
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blog-web-svc
                port:
                  number: 80
