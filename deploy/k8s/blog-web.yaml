apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-web
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-web
  template:
    metadata:
      labels:
        app: blog-web
    spec:
      imagePullSecrets:
        - name: tcr-secret
      containers:
        - name: blog-web
          image: ccr.ccs.tencentyun.com/blog-865748877/blog-web:v1
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: blog-web-svc
  namespace: default
spec:
  selector:
    app: blog-web
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-web-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
    - host: shturl.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blog-web-svc
                port:
                  number: 80
