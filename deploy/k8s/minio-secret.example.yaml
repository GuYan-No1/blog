# 用法：在服务器上执行（不要在本地存实际值）
#
# kubectl create secret generic minio-secret \
#   --from-literal=access-key='<你的 MinIO Access Key>' \
#   --from-literal=secret-key='<你的 MinIO Secret Key>'
#
# 或者：
#
# cat <<SECRET | kubectl apply -f -
# apiVersion: v1
# kind: Secret
# metadata:
#   name: minio-secret
# type: Opaque
# stringData:
#   access-key: <替换成实际值>
#   secret-key: <替换成实际值>
# SECRET
