name: Build & Deploy Blog

# 手动触发：在 GitHub 仓库 Actions 页面点 "Run workflow"
on:
  workflow_dispatch:
    inputs:
      service:
        description: 选择要发布的镜像
        required: true
        type: choice
        options:
          - web
          - api
          - both
        default: web
      image_tag:
        description: 镜像标签（留空则自动使用 sha-提交短哈希）
        required: false
        type: string
      do_deploy:
        description: 构建完成后是否立即部署到 k3s 集群
        required: true
        type: boolean
        default: true

# 同一时刻只允许一条发布流水线，避免并发改集群
concurrency:
  group: deploy-blog
  cancel-in-progress: false

env:
  TCR_REGISTRY: ccr.ccs.tencentyun.com
  TCR_NAMESPACE: blog-865748877

jobs:
  # ─────────────────────────────────────────────
  # 准备：统一计算镜像标签，供后续所有 job 复用
  # ─────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Validate required variables
        if: inputs.service == 'web' || inputs.service == 'both'
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL}" ]; then
            echo "::error::缺少仓库变量 NEXT_PUBLIC_API_URL，请先到 Settings → Secrets and variables → Actions → Variables 添加"
            exit 1
          fi
          echo "前端构建期 API 地址: ${API_URL}"

      - name: Compute image tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # 输入值走环境变量而非直接拼接，避免特殊字符带来的 shell 注入
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="sha-$(echo "${SHA}" | cut -c1-7)"
          fi
          # 只允许字母、数字、点、横线、下划线
          if ! echo "${TAG}" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::非法镜像标签: ${TAG}"
            exit 1
          fi
          echo "本次镜像标签: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────
  # 构建前端 Next.js 镜像
  # 注意：NEXT_PUBLIC_API_URL 必须在构建阶段传入，运行时注入无效
  # ─────────────────────────────────────────────
  build-web:
    needs: prepare
    if: inputs.service == 'web' || inputs.service == 'both'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 用原生 docker login，不用 docker/login-action：
      # 该 action 会先探测镜像仓库 /v2/ 接口，TCR 个人版对该探测返回
      # "unauthorized: no scope specify"，导致登录失败。
      - name: Login to TCR
        env:
          REGISTRY: ${{ env.TCR_REGISTRY }}
          TCR_USER: ${{ secrets.TCR_USERNAME }}
          TCR_PWD: ${{ secrets.TCR_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${TCR_PWD}" | docker login "${REGISTRY}" -u "${TCR_USER}" --password-stdin

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 服务器是 x86_64，固定平台避免架构不匹配
          platforms: linux/amd64
          push: true
          # 关键：NEXT_PUBLIC_* 是构建时变量，必须在这里传
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/blog-web:${{ needs.prepare.outputs.tag }}
            ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/blog-web:latest
  # ─────────────────────────────────────────────
  # 构建后端 FastAPI 镜像
  # ─────────────────────────────────────────────
  build-api:
    needs: prepare
    if: inputs.service == 'api' || inputs.service == 'both'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to TCR
        env:
          REGISTRY: ${{ env.TCR_REGISTRY }}
          TCR_USER: ${{ secrets.TCR_USERNAME }}
          TCR_PWD: ${{ secrets.TCR_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${TCR_PWD}" | docker login "${REGISTRY}" -u "${TCR_USER}" --password-stdin

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/blog-api:${{ needs.prepare.outputs.tag }}
            ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/blog-api:latest

  # ─────────────────────────────────────────────
  # 部署：SSH 到服务器执行 kubectl 滚动更新
  # ─────────────────────────────────────────────
  deploy:
    needs: [prepare, build-web, build-api]
    # 有构建失败就不部署；任一构建成功（或跳过）才继续
    if: |
      always() && inputs.do_deploy && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy web
        if: needs.build-web.result == 'success'
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ccr.ccs.tencentyun.com/blog-865748877/blog-web:${{ needs.prepare.outputs.tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 10m
          envs: IMAGE
          script: |
            set -e
            # root 直接用 kubectl；普通用户走 sudo k3s kubectl
            if kubectl get nodes >/dev/null 2>&1; then
              K="kubectl"
            else
              K="sudo -n k3s kubectl"
            fi
            echo "=== 更新 blog-web 镜像 -> ${IMAGE} ==="
            $K -n default set image deploy/blog-web blog-web="${IMAGE}"
            if ! $K -n default rollout status deploy/blog-web --timeout=240s; then
              echo "=== 滚动更新失败，自动回滚 ==="
              $K -n default rollout undo deploy/blog-web
              $K -n default rollout status deploy/blog-web --timeout=240s
              exit 1
            fi
            $K -n default get pods -l app=blog-web -o wide

      - name: Deploy api
        if: needs.build-api.result == 'success'
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ccr.ccs.tencentyun.com/blog-865748877/blog-api:${{ needs.prepare.outputs.tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 10m
          envs: IMAGE
          script: |
            set -e
            if kubectl get nodes >/dev/null 2>&1; then
              K="kubectl"
            else
              K="sudo -n k3s kubectl"
            fi
            echo "=== 更新 blog-api 镜像 -> ${IMAGE} ==="
            $K -n default set image deploy/blog-api blog-api="${IMAGE}"
            if ! $K -n default rollout status deploy/blog-api --timeout=240s; then
              echo "=== 滚动更新失败，自动回滚 ==="
              $K -n default rollout undo deploy/blog-api
              $K -n default rollout status deploy/blog-api --timeout=240s
              exit 1
            fi
            $K -n default get pods -l app=blog-api -o wide

      - name: Smoke test (公网验证)
        run: |
          set -e
          echo "--- 博客首页 ---"
          curl -sS -o /dev/null -w "status=%{http_code}\n" https://xmoekr.cn/
          echo "--- 后端接口 ---"
          curl -sS -o /dev/null -w "status=%{http_code}\n" https://api.xmoekr.cn/api/v1/articles
